<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="195" viewBox="0 0 1000 195" role="img" aria-labelledby="title desc">
<title id="title">Working process</title><desc id="desc">Illustration of the working process, not a progress indicator.</desc>
<defs><linearGradient id="wash" x2="1" y2="1"><stop stop-color="#26164A"/><stop offset="1" stop-color="#0B1020"/></linearGradient><linearGradient id="spectrum"><stop stop-color="#C49AFF"/><stop offset=".28" stop-color="#FF7FCB"/><stop offset=".55" stop-color="#65D9FF"/><stop offset=".8" stop-color="#65F2BE"/><stop offset="1" stop-color="#65F2BE"/></linearGradient><radialGradient id="purple-haze"><stop stop-color="#AC57FF"/><stop offset="1" stop-color="#8739D8" stop-opacity="0"/></radialGradient><radialGradient id="blue-haze"><stop stop-color="#23CEEF"/><stop offset="1" stop-color="#007D9B" stop-opacity="0"/></radialGradient></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}.aura{animation:breathe 7s ease-in-out infinite alternate}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 24s linear infinite}@keyframes breathe{from{opacity:.14}to{opacity:.38}}@keyframes orbit{to{transform:rotate(360deg)}}.sweep{stroke-dasharray:7 193;animation:sweep 7s ease-in-out infinite}@keyframes sweep{0%,8%{stroke-dashoffset:10}75%,100%{stroke-dashoffset:-105}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.travel,.return,.sweep{display:none}}</style>
<rect width="1000" height="195" fill="url(#wash)"/>
<g aria-hidden="true"><ellipse class="aura" cx="870.0" cy="35.1" rx="220.0" ry="97.5" fill="url(#purple-haze)" opacity=".2"/><ellipse class="aura" style="animation-delay:-3s" cx="120.0" cy="185.25" rx="260.0" ry="64.35000000000001" fill="url(#blue-haze)" opacity=".2"/><path d="M0 1 H1000" stroke="url(#spectrum)" stroke-width="3"/><circle class="orbit" cx="940" cy="60" r="29" fill="none" stroke="#F985D0" stroke-opacity=".3" stroke-dasharray="3 12"/></g>
<text x="40" y="40" font-size="17" fill="#B2BED5" font-weight="600" text-anchor="start">FROM BRIEF TO THE NEXT VERSION</text><text x="40" y="100" font-size="18" fill="#C49AFF" font-weight="400" text-anchor="start">01</text><text x="40" y="137" font-size="25" fill="#EEF2FF" font-weight="400" text-anchor="start">Scope</text><text x="231" y="100" font-size="18" fill="#65D9FF" font-weight="400" text-anchor="start">02</text><text x="231" y="137" font-size="25" fill="#EEF2FF" font-weight="400" text-anchor="start">Design</text><text x="422" y="100" font-size="18" fill="#65F2BE" font-weight="400" text-anchor="start">03</text><text x="422" y="137" font-size="25" fill="#EEF2FF" font-weight="400" text-anchor="start">Build</text><text x="613" y="100" font-size="18" fill="#C49AFF" font-weight="400" text-anchor="start">04</text><text x="613" y="137" font-size="25" fill="#EEF2FF" font-weight="400" text-anchor="start">Verify</text><text x="804" y="100" font-size="18" fill="#65D9FF" font-weight="400" text-anchor="start">05</text><text x="804" y="137" font-size="25" fill="#EEF2FF" font-weight="400" text-anchor="start">Release</text><path d="M40 164L960 164" fill="none" stroke="#354560" stroke-width="2" /><path d="M40 164L960 164" fill="none" stroke="url(#spectrum)" stroke-width="3" class="sweep" pathLength="100"/>
</svg>
