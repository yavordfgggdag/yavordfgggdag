<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="195" viewBox="0 0 1000 195" role="img" aria-labelledby="title desc">
<title id="title">Working process</title><desc id="desc">Illustration of the working process, not a progress indicator.</desc>
<defs><linearGradient id="wash" x2="1" y2="1"><stop stop-color="#151632"/><stop offset="1" stop-color="#0B1020"/></linearGradient><linearGradient id="spectrum"><stop stop-color="#B8A1FF"/><stop offset=".52" stop-color="#83C9F4"/><stop offset="1" stop-color="#73DFCA"/></linearGradient></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}.sweep{stroke-dasharray:7 193;animation:sweep 20s ease-in-out infinite}@keyframes sweep{0%,8%{stroke-dashoffset:10}75%,100%{stroke-dashoffset:-105}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.travel,.return,.sweep{display:none}}</style>
<rect width="1000" height="195" fill="url(#wash)"/>
<text x="40" y="40" font-size="17" fill="#B2BED5" font-weight="600" text-anchor="start">FROM BRIEF TO THE NEXT VERSION</text><text x="40" y="100" font-size="18" fill="#B8A1FF" font-weight="400" text-anchor="start">01</text><text x="40" y="137" font-size="25" fill="#EEF2FF" font-weight="400" text-anchor="start">Scope</text><text x="231" y="100" font-size="18" fill="#83C9F4" font-weight="400" text-anchor="start">02</text><text x="231" y="137" font-size="25" fill="#EEF2FF" font-weight="400" text-anchor="start">Design</text><text x="422" y="100" font-size="18" fill="#73DFCA" font-weight="400" text-anchor="start">03</text><text x="422" y="137" font-size="25" fill="#EEF2FF" font-weight="400" text-anchor="start">Build</text><text x="613" y="100" font-size="18" fill="#B8A1FF" font-weight="400" text-anchor="start">04</text><text x="613" y="137" font-size="25" fill="#EEF2FF" font-weight="400" text-anchor="start">Verify</text><text x="804" y="100" font-size="18" fill="#83C9F4" font-weight="400" text-anchor="start">05</text><text x="804" y="137" font-size="25" fill="#EEF2FF" font-weight="400" text-anchor="start">Release</text><path d="M40 164L960 164" fill="none" stroke="#354560" stroke-width="2" /><path d="M40 164L960 164" fill="none" stroke="url(#spectrum)" stroke-width="3" class="sweep" pathLength="100"/>
</svg>
