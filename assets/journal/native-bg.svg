<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
<title id="title">01 / КОМАНДИ И СЪБИТИЯ</title><desc id="desc">SwiftUI sends commands to Node.js and receives NDJSON events. The engine checks local project files. Optional hosting and cloud integrations depend on setup.</desc>
<defs><linearGradient id="wash" x2="1" y2="1"><stop stop-color="#26164A"/><stop offset="1" stop-color="#0B1020"/></linearGradient><linearGradient id="spectrum"><stop stop-color="#C49AFF"/><stop offset=".28" stop-color="#FF7FCB"/><stop offset=".55" stop-color="#65D9FF"/><stop offset=".8" stop-color="#65F2BE"/><stop offset="1" stop-color="#65F2BE"/></linearGradient><radialGradient id="purple-haze"><stop stop-color="#AC57FF"/><stop offset="1" stop-color="#8739D8" stop-opacity="0"/></radialGradient><radialGradient id="blue-haze"><stop stop-color="#23CEEF"/><stop offset="1" stop-color="#007D9B" stop-opacity="0"/></radialGradient></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}.aura{animation:breathe 7s ease-in-out infinite alternate}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 24s linear infinite}@keyframes breathe{from{opacity:.14}to{opacity:.38}}@keyframes orbit{to{transform:rotate(360deg)}}.travel{stroke-dasharray:8 192;animation:transit 5s ease-in-out infinite}.return{stroke-dasharray:8 192;animation:transit 5s ease-in-out 1.8s infinite}@keyframes transit{0%,12%{stroke-dashoffset:10}65%,100%{stroke-dashoffset:-105}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.travel,.return,.sweep{display:none}}</style>
<rect width="1000" height="360" fill="url(#wash)"/>
<g aria-hidden="true"><ellipse class="aura" cx="870.0" cy="64.8" rx="220.0" ry="180.0" fill="url(#purple-haze)" opacity=".2"/><ellipse class="aura" style="animation-delay:-3s" cx="120.0" cy="342.0" rx="260.0" ry="118.80000000000001" fill="url(#blue-haze)" opacity=".2"/><path d="M0 1 H1000" stroke="url(#spectrum)" stroke-width="3"/><circle class="orbit" cx="940" cy="60" r="29" fill="none" stroke="#F985D0" stroke-opacity=".3" stroke-dasharray="3 12"/></g>
<text x="40" y="40" font-size="18" fill="#B2BED5" font-weight="600" text-anchor="start">01 / КОМАНДИ И СЪБИТИЯ</text><text x="156" y="133" font-size="35" fill="#C49AFF" font-weight="600" text-anchor="middle">SwiftUI</text><text x="156" y="169" font-size="22" fill="#EEF2FF" font-weight="400" text-anchor="middle">Нативен интерфейс</text><circle cx="156" cy="203" r="5" fill="#C49AFF"/><path d="M170 203L486 203" fill="none" stroke="#354560" stroke-width="2" /><path d="M170 203L486 203" fill="none" stroke="#C49AFF" stroke-width="3" class="travel" pathLength="100"/><text x="328.0" y="239" font-size="17" fill="#B2BED5" font-weight="400" text-anchor="middle">команда →</text><text x="500" y="133" font-size="35" fill="#65D9FF" font-weight="600" text-anchor="middle">Node.js</text><text x="500" y="169" font-size="22" fill="#EEF2FF" font-weight="400" text-anchor="middle">Модул за проверки</text><circle cx="500" cy="203" r="5" fill="#65D9FF"/><path d="M514 203L830 203" fill="none" stroke="#354560" stroke-width="2" /><path d="M514 203L830 203" fill="none" stroke="#65D9FF" stroke-width="3" class="travel" pathLength="100"/><text x="672.0" y="239" font-size="17" fill="#B2BED5" font-weight="400" text-anchor="middle">проверки →</text><text x="844" y="133" font-size="35" fill="#65F2BE" font-weight="600" text-anchor="middle">Проверки</text><text x="844" y="169" font-size="22" fill="#EEF2FF" font-weight="400" text-anchor="middle">Локален проект</text><circle cx="844" cy="203" r="5" fill="#65F2BE"/><path d="M486 268L170 268" fill="none" stroke="#354560" stroke-width="1" /><path d="M486 268L170 268" fill="none" stroke="#65D9FF" stroke-width="2" class="return" pathLength="100"/><text x="328" y="297" font-size="17" fill="#65D9FF" font-weight="400" text-anchor="middle">← NDJSON</text><text x="40" y="335" font-size="16" fill="#B2BED5" font-weight="400" text-anchor="start">Схема на архитектурата · не е жив статус</text>
</svg>
