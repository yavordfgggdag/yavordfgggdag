<svg xmlns="http://www.w3.org/2000/svg" width="390" height="290" viewBox="0 0 390 290" role="img" aria-labelledby="title desc">
<title id="title">Yavor — creative engineering</title><desc id="desc">Decorative animated introduction. No live status.</desc>
<defs><linearGradient id="wash" x2="1" y2="1"><stop stop-color="#26164A"/><stop offset="1" stop-color="#0B1020"/></linearGradient><linearGradient id="spectrum"><stop stop-color="#C49AFF"/><stop offset=".28" stop-color="#FF7FCB"/><stop offset=".55" stop-color="#65D9FF"/><stop offset=".8" stop-color="#65F2BE"/><stop offset="1" stop-color="#65F2BE"/></linearGradient><radialGradient id="purple-haze"><stop stop-color="#AC57FF"/><stop offset="1" stop-color="#8739D8" stop-opacity="0"/></radialGradient><radialGradient id="blue-haze"><stop stop-color="#23CEEF"/><stop offset="1" stop-color="#007D9B" stop-opacity="0"/></radialGradient></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}.aura{animation:breathe 7s ease-in-out infinite alternate}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 24s linear infinite}@keyframes breathe{from{opacity:.14}to{opacity:.38}}@keyframes orbit{to{transform:rotate(360deg)}}.intro-flow{stroke-dasharray:24 8;animation:flow 9s linear infinite}@keyframes flow{to{stroke-dashoffset:-96}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.travel,.return,.sweep{display:none}}</style>
<rect width="390" height="290" fill="url(#wash)"/>
<g aria-hidden="true"><ellipse class="aura" cx="339.3" cy="52.199999999999996" rx="85.8" ry="145.0" fill="url(#purple-haze)" opacity=".2"/><ellipse class="aura" style="animation-delay:-3s" cx="46.8" cy="275.5" rx="101.4" ry="95.7" fill="url(#blue-haze)" opacity=".2"/><path d="M0 1 H390" stroke="url(#spectrum)" stroke-width="3"/><circle class="orbit" cx="330" cy="60" r="29" fill="none" stroke="#F985D0" stroke-opacity=".3" stroke-dasharray="3 12"/></g>
<text x="24" y="40" font-size="14" fill="#65F2BE" font-weight="600" text-anchor="start">ИДЕИ → ИНТЕРФЕЙСИ → ПРОДУКТИ</text><text x="24" y="94" font-size="38" fill="#C49AFF" font-weight="700" text-anchor="start">Уеб.</text><text x="24" y="154" font-size="38" fill="#65D9FF" font-weight="700" text-anchor="start">Софтуер.</text><text x="24" y="214" font-size="38" fill="#65F2BE" font-weight="700" text-anchor="start">Общности.</text><text x="24" y="263" font-size="16" fill="#EEF2FF" font-weight="400" text-anchor="start">От идеята до работещото решение.</text><path d="M24 280L366 280" fill="none" stroke="url(#spectrum)" stroke-width="3" class="intro-flow" pathLength="100"/>
</svg>
