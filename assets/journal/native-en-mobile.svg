<svg xmlns="http://www.w3.org/2000/svg" width="390" height="430" viewBox="0 0 390 430" role="img" aria-labelledby="title desc">
<title id="title">01 / COMMANDS &amp; EVENTS</title><desc id="desc">SwiftUI sends commands to Node.js and receives NDJSON events. The engine checks local project files. Optional hosting and cloud integrations depend on setup.</desc>
