<svg xmlns="http://www.w3.org/2000/svg" width="390" height="430" viewBox="0 0 390 430" role="img" aria-labelledby="title desc">
<title id="title">01 / COMMANDS &amp; EVENTS</title><desc id="desc">SwiftUI sends commands to Node.js and receives NDJSON events. The engine checks local project files. Optional hosting and cloud integrations depend on setup.</desc>
<defs><linearGradient id="wash" x2="1" y2="1"><stop stop-color="#26164A"/><stop offset="1" stop-color="#0B1020"/></linearGradient><linearGradient id="spectrum"><stop stop-color="#C49AFF"/><stop offset=".28" stop-color="#FF7FCB"/><stop offset=".55" stop-color="#65D9FF"/><stop offset=".8" stop-color="#65F2BE"/><stop offset="1" stop-color="#65F2BE"/></linearGradient><radialGradient id="purple-haze"><stop stop-color="#AC57FF"/><stop offset="1" stop-color="#8739D8" stop-opacity="0"/></radialGradient><radialGradient id="blue-haze"><stop stop-color="#23CEEF"/><stop offset="1" stop-color="#007D9B" stop-opacity="0"/></radialGradient></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}.aura{animation:breathe 7s ease-in-out infinite alternate}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 24s linear infinite}@keyframes breathe{from{opacity:.14}to{opacity:.38}}@keyframes orbit{to{transform:rotate(360deg)}}.travel{stroke-dasharray:8 192;animation:transit 5s ease-in-out infinite}.return{stroke-dasharray:8 192;animation:transit 5s ease-in-out 1.8s infinite}@keyframes transit{0%,12%{stroke-dashoffset:10}65%,100%{stroke-dashoffset:-105}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.travel,.return,.sweep{display:none}}</style>
<rect width="390" height="430" fill="url(#wash)"/>
<g aria-hidden="true"><ellipse class="aura" cx="339.3" cy="77.39999999999999" rx="85.8" ry="215.0" fill="url(#purple-haze)" opacity=".2"/><ellipse class="aura" style="animation-delay:-3s" cx="46.8" cy="408.5" rx="101.4" ry="141.9" fill="url(#blue-haze)" opacity=".2"/><path d="M0 1 H390" stroke="url(#spectrum)" stroke-width="3"/><circle class="orbit" cx="330" cy="60" r="29" fill="none" stroke="#F985D0" stroke-opacity=".3" stroke-dasharray="3 12"/></g>
<text x="24" y="35" font-size="13" fill="#B2BED5" font-weight="600" text-anchor="start">01 / COMMANDS &amp; EVENTS</text><circle cx="36" cy="84" r="5" fill="#C49AFF"/><text x="62" y="91" font-size="27" fill="#C49AFF" font-weight="600" text-anchor="start">SwiftUI</text><text x="62" y="118" font-size="17" fill="#EEF2FF" font-weight="400" text-anchor="start">Native interface</text><path d="M36 100L36 187" fill="none" stroke="#354560" stroke-width="2" /><path d="M36 100L36 187" fill="none" stroke="#C49AFF" stroke-width="2" class="travel" pathLength="100"/><text x="62" y="159" font-size="14" fill="#B2BED5" font-weight="400" text-anchor="start">command / NDJSON</text><circle cx="36" cy="202" r="5" fill="#65D9FF"/><text x="62" y="209" font-size="27" fill="#65D9FF" font-weight="600" text-anchor="start">Node.js</text><text x="62" y="236" font-size="17" fill="#EEF2FF" font-weight="400" text-anchor="start">Check engine</text><path d="M36 218L36 305" fill="none" stroke="#354560" stroke-width="2" /><path d="M36 218L36 305" fill="none" stroke="#65D9FF" stroke-width="2" class="travel" pathLength="100"/><text x="62" y="277" font-size="14" fill="#B2BED5" font-weight="400" text-anchor="start">local checks</text><circle cx="36" cy="320" r="5" fill="#65F2BE"/><text x="62" y="327" font-size="27" fill="#65F2BE" font-weight="600" text-anchor="start">Checks</text><text x="62" y="354" font-size="17" fill="#EEF2FF" font-weight="400" text-anchor="start">Local project</text><text x="24" y="407" font-size="13" fill="#B2BED5" font-weight="400" text-anchor="start">Architecture diagram · not live status</text>
</svg>
