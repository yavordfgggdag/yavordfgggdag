<svg xmlns="http://www.w3.org/2000/svg" width="390" height="360" viewBox="0 0 390 360" role="img" aria-labelledby="title desc">
<title id="title">Процес на работа</title><desc id="desc">Illustration of the working process, not a progress indicator.</desc>
<defs><linearGradient id="wash" x2="1" y2="1"><stop stop-color="#151632"/><stop offset="1" stop-color="#0B1020"/></linearGradient><linearGradient id="spectrum"><stop stop-color="#B8A1FF"/><stop offset=".52" stop-color="#83C9F4"/><stop offset="1" stop-color="#73DFCA"/></linearGradient></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}.sweep{stroke-dasharray:7 193;animation:sweep 20s ease-in-out infinite}@keyframes sweep{0%,8%{stroke-dashoffset:10}75%,100%{stroke-dashoffset:-105}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.travel,.return,.sweep{display:none}}</style>
<rect width="390" height="360" fill="url(#wash)"/>
<text x="24" y="36" font-size="13" fill="#B2BED5" font-weight="600" text-anchor="start">ОТ ЗАДАЧАТА ДО СЛЕДВАЩАТА ВЕРСИЯ</text><text x="24" y="85" font-size="15" fill="#B8A1FF" font-weight="400" text-anchor="start">01</text><text x="65" y="85" font-size="24" fill="#EEF2FF" font-weight="400" text-anchor="start">Обхват</text><path d="M31 95L31 122" fill="none" stroke="#354560" stroke-width="1" /><text x="24" y="146" font-size="15" fill="#83C9F4" font-weight="400" text-anchor="start">02</text><text x="65" y="146" font-size="24" fill="#EEF2FF" font-weight="400" text-anchor="start">Дизайн</text><path d="M31 156L31 183" fill="none" stroke="#354560" stroke-width="1" /><text x="24" y="207" font-size="15" fill="#73DFCA" font-weight="400" text-anchor="start">03</text><text x="65" y="207" font-size="24" fill="#EEF2FF" font-weight="400" text-anchor="start">Разработка</text><path d="M31 217L31 244" fill="none" stroke="#354560" stroke-width="1" /><text x="24" y="268" font-size="15" fill="#B8A1FF" font-weight="400" text-anchor="start">04</text><text x="65" y="268" font-size="24" fill="#EEF2FF" font-weight="400" text-anchor="start">Проверка</text><path d="M31 278L31 305" fill="none" stroke="#354560" stroke-width="1" /><text x="24" y="329" font-size="15" fill="#83C9F4" font-weight="400" text-anchor="start">05</text><text x="65" y="329" font-size="24" fill="#EEF2FF" font-weight="400" text-anchor="start">Публикуване</text>
</svg>
