<svg xmlns="http://www.w3.org/2000/svg" width="390" height="360" viewBox="0 0 390 360" role="img" aria-labelledby="title desc">
<title id="title">Процес на работа</title><desc id="desc">Illustration of the working process, not a progress indicator.</desc>
<defs><linearGradient id="wash" x2="1" y2="1"><stop stop-color="#26164A"/><stop offset="1" stop-color="#0B1020"/></linearGradient><linearGradient id="spectrum"><stop stop-color="#C49AFF"/><stop offset=".28" stop-color="#FF7FCB"/><stop offset=".55" stop-color="#65D9FF"/><stop offset=".8" stop-color="#65F2BE"/><stop offset="1" stop-color="#65F2BE"/></linearGradient><radialGradient id="purple-haze"><stop stop-color="#AC57FF"/><stop offset="1" stop-color="#8739D8" stop-opacity="0"/></radialGradient><radialGradient id="blue-haze"><stop stop-color="#23CEEF"/><stop offset="1" stop-color="#007D9B" stop-opacity="0"/></radialGradient></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}.aura{animation:breathe 7s ease-in-out infinite alternate}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 24s linear infinite}@keyframes breathe{from{opacity:.14}to{opacity:.38}}@keyframes orbit{to{transform:rotate(360deg)}}.sweep{stroke-dasharray:7 193;animation:sweep 7s ease-in-out infinite}@keyframes sweep{0%,8%{stroke-dashoffset:10}75%,100%{stroke-dashoffset:-105}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.travel,.return,.sweep{display:none}}</style>
<rect width="390" height="360" fill="url(#wash)"/>
<g aria-hidden="true"><ellipse class="aura" cx="339.3" cy="64.8" rx="85.8" ry="180.0" fill="url(#purple-haze)" opacity=".2"/><ellipse class="aura" style="animation-delay:-3s" cx="46.8" cy="342.0" rx="101.4" ry="118.80000000000001" fill="url(#blue-haze)" opacity=".2"/><path d="M0 1 H390" stroke="url(#spectrum)" stroke-width="3"/><circle class="orbit" cx="330" cy="60" r="29" fill="none" stroke="#F985D0" stroke-opacity=".3" stroke-dasharray="3 12"/></g>
<text x="24" y="36" font-size="13" fill="#B2BED5" font-weight="600" text-anchor="start">ОТ ЗАДАЧАТА ДО СЛЕДВАЩАТА ВЕРСИЯ</text><text x="24" y="85" font-size="15" fill="#C49AFF" font-weight="400" text-anchor="start">01</text><text x="65" y="85" font-size="24" fill="#EEF2FF" font-weight="400" text-anchor="start">Обхват</text><path d="M31 95L31 122" fill="none" stroke="#354560" stroke-width="1" /><text x="24" y="146" font-size="15" fill="#65D9FF" font-weight="400" text-anchor="start">02</text><text x="65" y="146" font-size="24" fill="#EEF2FF" font-weight="400" text-anchor="start">Дизайн</text><path d="M31 156L31 183" fill="none" stroke="#354560" stroke-width="1" /><text x="24" y="207" font-size="15" fill="#65F2BE" font-weight="400" text-anchor="start">03</text><text x="65" y="207" font-size="24" fill="#EEF2FF" font-weight="400" text-anchor="start">Разработка</text><path d="M31 217L31 244" fill="none" stroke="#354560" stroke-width="1" /><text x="24" y="268" font-size="15" fill="#C49AFF" font-weight="400" text-anchor="start">04</text><text x="65" y="268" font-size="24" fill="#EEF2FF" font-weight="400" text-anchor="start">Проверка</text><path d="M31 278L31 305" fill="none" stroke="#354560" stroke-width="1" /><text x="24" y="329" font-size="15" fill="#65D9FF" font-weight="400" text-anchor="start">05</text><text x="65" y="329" font-size="24" fill="#EEF2FF" font-weight="400" text-anchor="start">Публикуване</text>
</svg>
