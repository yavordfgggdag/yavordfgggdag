xt-anchor="start">PLpgSQL</text><text x="366" y="354" font-size="18" fill="#7CB8C5" font-weight="400" text-anchor="end">4.1%</text><rect x="24" y="364" width="342" height="5" rx="2" fill="#29364D"/><rect x="24" y="364" width="14.030" height="5" rx="2" fill="#7CB8C5"/><text x="24" y="403" font-size="18" fill="#EEF2FF" font-weight="400" text-anchor="start">Other</text><text x="366" y="403" font-size="18" fill="#8997B0" font-weight="400" text-anchor="end">2.0%</text><rect x="24" y="413" width="342" height="5" rx="2" fill="#29364D"/><rect x="24" y="413" width="6.974" height="5" rx="2" fill="#8997B0"/><text x="24" y="459" font-size="14" fill="#B2BED5" font-weight="400" text-anchor="start">Code volume, not time or proficiency.</text>
</svg>
