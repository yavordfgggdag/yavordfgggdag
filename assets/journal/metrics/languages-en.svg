<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="449" viewBox="0 0 1000 449" role="img" aria-labelledby="title desc">
<title id="title">Languages by code volume</title><desc id="desc">Fixed aggregate language-byte snapshot. Includes private projects without their names or code; excludes the profile repository. Does not measure hours or skill.</desc>
<defs><linearGradient id="wash" x2="1" y2="1"><stop stop-color="#26164A"/><stop offset="1" stop-color="#0B1020"/></linearGradient><linearGradient id="spectrum"><stop stop-color="#C49AFF"/><stop offset=".28" stop-color="#FF7FCB"/><stop offset=".55" stop-color="#65D9FF"/><stop offset=".8" stop-color="#65F2BE"/><stop offset="1" stop-color="#65F2BE"/></linearGradient><radialGradient id="purple-haze"><stop stop-color="#AC57FF"/><stop offset="1" stop-color="#8739D8" stop-opacity="0"/></radialGradient><radialGradient id="blue-haze"><stop stop-color="#23CEEF"/><stop offset="1" stop-color="#007D9B" stop-opacity="0"/></radialGradient></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}.aura{animation:breathe 7s ease-in-out infinite alternate}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 24s linear infinite}@keyframes breathe{from{opacity:.14}to{opacity:.38}}@keyframes orbit{to{transform:rotate(360deg)}}.aura,.orbit{animation:none!important}@media(prefers-reduced-motion:reduce){*{animation:none!important}.travel,.return,.sweep{display:none}}</style>
<rect width="1000" height="449" fill="url(#wash)"/>
<g aria-hidden="true"><ellipse class="aura" cx="870.0" cy="80.82" rx="220.0" ry="224.5" fill="url(#purple-haze)" opacity=".2"/><ellipse class="aura" style="animation-delay:-3s" cx="120.0" cy="426.54999999999995" rx="260.0" ry="148.17000000000002" fill="url(#blue-haze)" opacity=".2"/><path d="M0 1 H1000" stroke="url(#spectrum)" stroke-width="3"/><circle class="orbit" cx="940" cy="60" r="29" fill="none" stroke="#F985D0" stroke-opacity=".3" stroke-dasharray="3 12"/></g>
