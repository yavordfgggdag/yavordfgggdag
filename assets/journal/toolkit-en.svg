<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="208" viewBox="0 0 1000 208" role="img" aria-labelledby="title desc">
<title id="title">Technology behind the work</title><desc id="desc">Selected technologies documented in the existing project descriptions. Full language and tool catalogue follows as selectable text.</desc>
<defs><linearGradient id="wash" x2="1" y2="1"><stop stop-color="#26164A"/><stop offset="1" stop-color="#0B1020"/></linearGradient><linearGradient id="spectrum"><stop stop-color="#C49AFF"/><stop offset=".28" stop-color="#FF7FCB"/><stop offset=".55" stop-color="#65D9FF"/><stop offset=".8" stop-color="#65F2BE"/><stop offset="1" stop-color="#65F2BE"/></linearGradient><radialGradient id="purple-haze"><stop stop-color="#AC57FF"/><stop offset="1" stop-color="#8739D8" stop-opacity="0"/></radialGradient><radialGradient id="blue-haze"><stop stop-color="#23CEEF"/><stop offset="1" stop-color="#007D9B" stop-opacity="0"/></radialGradient></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}.aura{animation:breathe 7s ease-in-out infinite alternate}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 24s linear infinite}@keyframes breathe{from{opacity:.14}to{opacity:.38}}@keyframes orbit{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.travel,.return,.sweep{display:none}}</style>
<rect width="1000" height="208" fill="url(#wash)"/>
<g aria-hidden="true"><ellipse class="aura" cx="870.0" cy="37.44" rx="220.0" ry="104.0" fill="url(#purple-haze)" opacity=".2"/><ellipse class="aura" style="animation-delay:-3s" cx="120.0" cy="197.6" rx="260.0" ry="68.64" fill="url(#blue-haze)" opacity=".2"/><path d="M0 1 H1000" stroke="url(#spectrum)" stroke-width="3"/><circle class="orbit" cx="940" cy="60" r="29" fill="none" stroke="#F985D0" stroke-opacity=".3" stroke-dasharray="3 12"/></g>
<text x="40" y="42" font-size="18" fill="#B2BED5" font-weight="600" text-anchor="start">TECHNOLOGY BEHIND THE WORK</text><text x="40" y="97" font-size="17" fill="#C49AFF" font-weight="600" text-anchor="start">NATIVE</text><text x="40" y="129" font-size="25" fill="#EEF2FF" font-weight="600" text-anchor="start">Swift · SwiftUI</text><text x="40" y="156" font-size="21" fill="#B2BED5" font-weight="400" text-anchor="start">Node.js · NDJSON</text><path d="M40 174L320 174" fill="none" stroke="#C49AFF" stroke-width="1" /><text x="368" y="97" font-size="17" fill="#65D9FF" font-weight="600" text-anchor="start">WEB</text><text x="368" y="129" font-size="25" fill="#EEF2FF" font-weight="600" text-anchor="start">TypeScript · React</text><text x="368" y="156" font-size="21" fill="#B2BED5" font-weight="400" text-anchor="start">Next.js · Tailwind</text><path d="M368 174L648 174" fill="none" stroke="#65D9FF" stroke-width="1" /><text x="696" y="97" font-size="17" fill="#65F2BE" font-weight="600" text-anchor="start">DATA</text><text x="696" y="129" font-size="25" fill="#EEF2FF" font-weight="600" text-anchor="start">Postgres · Drizzle</text><text x="696" y="156" font-size="21" fill="#B2BED5" font-weight="400" text-anchor="start">Supabase · discord.js</text><path d="M696 174L976 174" fill="none" stroke="#65F2BE" stroke-width="1" />
</svg>
