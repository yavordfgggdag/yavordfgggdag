<svg xmlns="http://www.w3.org/2000/svg" width="390" height="430" viewBox="0 0 390 430" role="img" aria-labelledby="title desc">
<title id="title">02 / СИНХРОНИЗАЦИЯ И ДОСТЪП</title><desc id="desc">A separate Discord Gateway bot synchronizes roster data into Postgres. The Next.js portal reads data and performs authorized management operations. Both use a shared role map.</desc>
<defs><linearGradient id="wash" x2="1" y2="1"><stop stop-color="#151632"/><stop offset="1" stop-color="#0B1020"/></linearGradient><linearGradient id="spectrum"><stop stop-color="#B8A1FF"/><stop offset=".52" stop-color="#83C9F4"/><stop offset="1" stop-color="#73DFCA"/></linearGradient></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}.travel{stroke-dasharray:8 192;animation:transit 14s ease-in-out infinite}.return{stroke-dasharray:8 192;animation:transit 14s ease-in-out 4s infinite}@keyframes transit{0%,12%{stroke-dashoffset:10}65%,100%{stroke-dashoffset:-105}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.travel,.return,.sweep{display:none}}</style>
<rect width="390" height="430" fill="url(#wash)"/>
<text x="24" y="35" font-size="13" fill="#B2BED5" font-weight="600" text-anchor="start">02 / СИНХРОНИЗАЦИЯ И ДОСТЪП</text><circle cx="36" cy="84" r="5" fill="#B8A1FF"/><text x="62" y="91" font-size="27" fill="#B8A1FF" font-weight="600" text-anchor="start">Discord bot</text><text x="62" y="118" font-size="17" fill="#EEF2FF" font-weight="400" text-anchor="start">Постоянна връзка</text><path d="M36 100L36 187" fill="none" stroke="#354560" stroke-width="2" /><path d="M36 100L36 187" fill="none" stroke="#B8A1FF" stroke-width="2" class="travel" pathLength="100"/><text x="62" y="159" font-size="14" fill="#B2BED5" font-weight="400" text-anchor="start">синхронизация →</text><circle cx="36" cy="202" r="5" fill="#83C9F4"/><text x="62" y="209" font-size="27" fill="#83C9F4" font-weight="600" text-anchor="start">Postgres</text><text x="62" y="236" font-size="17" fill="#EEF2FF" font-weight="400" text-anchor="start">Състав и журнал</text><path d="M36 218L36 305" fill="none" stroke="#354560" stroke-width="2" /><path d="M36 218L36 305" fill="none" stroke="#83C9F4" stroke-width="2" class="travel" pathLength="100"/><text x="62" y="277" font-size="14" fill="#B2BED5" font-weight="400" text-anchor="start">данни ↔</text><circle cx="36" cy="320" r="5" fill="#73DFCA"/><text x="62" y="327" font-size="27" fill="#73DFCA" font-weight="600" text-anchor="start">Next.js</text><text x="62" y="354" font-size="17" fill="#EEF2FF" font-weight="400" text-anchor="start">Права и операции</text><text x="24" y="407" font-size="13" fill="#B2BED5" font-weight="400" text-anchor="start">Схема на архитектурата · не е жив статус</text>
</svg>
