<svg xmlns="http://www.w3.org/2000/svg" width="390" height="410" viewBox="0 0 390 410" role="img" aria-labelledby="title desc">
<title id="title">Technology behind the work</title><desc id="desc">Selected technologies documented in the existing project descriptions. Full language and tool catalogue follows as selectable text.</desc>
<defs><linearGradient id="wash" x2="1" y2="1"><stop stop-color="#26164A"/><stop offset="1" stop-color="#0B1020"/></linearGradient><linearGradient id="spectrum"><stop stop-color="#C49AFF"/><stop offset=".28" stop-color="#FF7FCB"/><stop offset=".55" stop-color="#65D9FF"/><stop offset=".8" stop-color="#65F2BE"/><stop offset="1" stop-color="#65F2BE"/></linearGradient><radialGradient id="purple-haze"><stop stop-color="#AC57FF"/><stop offset="1" stop-color="#8739D8" stop-opacity="0"/></radialGradient><radialGradient id="blue-haze"><stop stop-color="#23CEEF"/><stop offset="1" stop-color="#007D9B" stop-opacity="0"/></radialGradient></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}.aura{animation:breathe 7s ease-in-out infinite alternate}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 24s linear infinite}@keyframes breathe{from{opacity:.14}to{opacity:.38}}@keyframes orbit{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.travel,.return,.sweep{display:none}}</style>
<rect width="390" height="410" fill="url(#wash)"/>
<g aria-hidden="true"><ellipse class="aura" cx="339.3" cy="73.8" rx="85.8" ry="205.0" fill="url(#purple-haze)" opacity=".2"/><ellipse class="aura" style="animation-delay:-3s" cx="46.8" cy="389.5" rx="101.4" ry="135.3" fill="url(#blue-haze)" opacity=".2"/><path d="M0 1 H390" stroke="url(#spectrum)" stroke-width="3"/><circle class="orbit" cx="330" cy="60" r="29" fill="none" stroke="#F985D0" stroke-opacity=".3" stroke-dasharray="3 12"/></g>
<text x="24" y="36" font-size="13" fill="#B2BED5" font-weight="600" text-anchor="start">TECHNOLOGY BEHIND THE WORK</text><text x="24" y="85" font-size="14" fill="#C49AFF" font-weight="600" text-anchor="start">NATIVE</text><text x="24" y="117" font-size="23" fill="#EEF2FF" font-weight="600" text-anchor="start">Swift · SwiftUI</text><text x="24" y="144" font-size="18" fill="#B2BED5" font-weight="400" text-anchor="start">Node.js · NDJSON</text><path d="M24 162L366 162" fill="none" stroke="#C49AFF" stroke-width="1" /><text x="24" y="197" font-size="14" fill="#65D9FF" font-weight="600" text-anchor="start">WEB</text><text x="24" y="229" font-size="23" fill="#EEF2FF" font-weight="600" text-anchor="start">TypeScript · React</text><text x="24" y="256" font-size="18" fill="#B2BED5" font-weight="400" text-anchor="start">Next.js · Tailwind</text><path d="M24 274L366 274" fill="none" stroke="#65D9FF" stroke-width="1" /><text x="24" y="309" font-size="14" fill="#65F2BE" font-weight="600" text-anchor="start">DATA</text><text x="24" y="341" font-size="23" fill="#EEF2FF" font-weight="600" text-anchor="start">Postgres · Drizzle</text><text x="24" y="368" font-size="18" fill="#B2BED5" font-weight="400" text-anchor="start">Supabase · discord.js</text><path d="M24 386L366 386" fill="none" stroke="#65F2BE" stroke-width="1" />
