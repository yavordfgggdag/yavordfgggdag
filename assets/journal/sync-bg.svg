<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
<title id="title">02 / СИНХРОНИЗАЦИЯ И ДОСТЪП</title><desc id="desc">A separate Discord Gateway bot synchronizes roster data into Postgres. The Next.js portal reads data and performs authorized management operations. Both use a shared role map.</desc>
<defs><linearGradient id="wash" x2="1" y2="1"><stop stop-color="#151632"/><stop offset="1" stop-color="#0B1020"/></linearGradient><linearGradient id="spectrum"><stop stop-color="#B8A1FF"/><stop offset=".52" stop-color="#83C9F4"/><stop offset="1" stop-color="#73DFCA"/></linearGradient></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}.travel{stroke-dasharray:8 192;animation:transit 14s ease-in-out infinite}.return{stroke-dasharray:8 192;animation:transit 14s ease-in-out 4s infinite}@keyframes transit{0%,12%{stroke-dashoffset:10}65%,100%{stroke-dashoffset:-105}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.travel,.return,.sweep{display:none}}</style>
<rect width="1000" height="360" fill="url(#wash)"/>
<text x="40" y="40" font-size="18" fill="#B2BED5" font-weight="600" text-anchor="start">02 / СИНХРОНИЗАЦИЯ И ДОСТЪП</text><text x="156" y="133" font-size="35" fill="#B8A1FF" font-weight="600" text-anchor="middle">Discord bot</text><text x="156" y="169" font-size="22" fill="#EEF2FF" font-weight="400" text-anchor="middle">Постоянна връзка</text><circle cx="156" cy="203" r="5" fill="#B8A1FF"/><path d="M170 203L486 203" fill="none" stroke="#354560" stroke-width="2" /><path d="M170 203L486 203" fill="none" stroke="#B8A1FF" stroke-width="3" class="travel" pathLength="100"/><text x="328.0" y="239" font-size="17" fill="#B2BED5" font-weight="400" text-anchor="middle">синхронизация →</text><text x="500" y="133" font-size="35" fill="#83C9F4" font-weight="600" text-anchor="middle">Postgres</text><text x="500" y="169" font-size="22" fill="#EEF2FF" font-weight="400" text-anchor="middle">Състав и журнал</text><circle cx="500" cy="203" r="5" fill="#83C9F4"/><path d="M514 203L830 203" fill="none" stroke="#354560" stroke-width="2" /><path d="M514 203L830 203" fill="none" stroke="#83C9F4" stroke-width="3" class="travel" pathLength="100"/><text x="672.0" y="239" font-size="17" fill="#B2BED5" font-weight="400" text-anchor="middle">данни ↔</text><text x="844" y="133" font-size="35" fill="#73DFCA" font-weight="600" text-anchor="middle">Next.js</text><text x="844" y="169" font-size="22" fill="#EEF2FF" font-weight="400" text-anchor="middle">Права и операции</text><circle cx="844" cy="203" r="5" fill="#73DFCA"/><text x="40" y="335" font-size="16" fill="#B2BED5" font-weight="400" text-anchor="start">Схема на архитектурата · не е жив статус</text>
</svg>
