<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="title desc"><title id="title">TLR Police Portal architecture</title><desc id="desc">A separate Discord Gateway bot synchronizes membership and roles to Postgres. The Next.js portal reads the roster and handles authorized management actions. Architecture diagram.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#12152f"/><stop offset="1" stop-color="#081c29"/></linearGradient><linearGradient id="accent"><stop stop-color="#ae8fff"/><stop offset=".52" stop-color="#57b6ff"/><stop offset="1" stop-color="#46dccc"/></linearGradient><radialGradient id="glow"><stop stop-color="#8171e0" stop-opacity=".2"/><stop offset="1" stop-color="#8171e0" stop-opacity="0"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#7d9dd2" stroke-opacity=".06"/></pattern></defs><style>text{font-family:Arial,Helvetica,sans-serif}.flow{stroke-dasharray:5 12;animation:flow 8s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}.orbit{transform-origin:830px 84px;animation:orbit 28s linear infinite}@keyframes flow{to{stroke-dashoffset:-170}}@keyframes pulse{50%{opacity:.35}}@keyframes orbit{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="960" height="380" rx="24" fill="url(#bg)"/><rect width="960" height="380" rx="24" fill="url(#grid)"/><rect x="1" y="1" width="958" height="378" rx="23" fill="none" stroke="#34405e"/>
<text x="34" y="45" fill="#63c7ff" font-size="17" letter-spacing="3">TLR / CONNECTED SYSTEMS</text>
<text x="34" y="91" fill="#f4f6ff" font-size="34" font-weight="700">Live events. Shared data. Clear roles.</text>
<path d="M294 191H350M610 191H666" stroke="#345773" stroke-width="3"/>
<path d="M294 191H350M610 191H666" stroke="url(#accent)" stroke-width="3" class="flow"/>
<rect x="34" y="137" width="260" height="110" rx="15" fill="#101c30" stroke="#b398ff" stroke-opacity=".55"/><rect x="52" y="159" width="5" height="66" rx="2" fill="#b398ff"/><text x="74" y="184" fill="#eef4ff" font-size="27" font-weight="700">Discord bot</text><text x="74" y="219" fill="#b398ff" font-size="19">Persistent Gateway</text><rect x="350" y="137" width="260" height="110" rx="15" fill="#101c30" stroke="#64bbff" stroke-opacity=".55"/><rect x="368" y="159" width="5" height="66" rx="2" fill="#64bbff"/><text x="390" y="184" fill="#eef4ff" font-size="27" font-weight="700">Postgres</text><text x="390" y="219" fill="#64bbff" font-size="19">Roster + audit data</text><rect x="666" y="137" width="260" height="110" rx="15" fill="#101c30" stroke="#4bdbca" stroke-opacity=".55"/><rect x="684" y="159" width="5" height="66" rx="2" fill="#4bdbca"/><text x="706" y="184" fill="#eef4ff" font-size="27" font-weight="700">Next.js portal</text><text x="706" y="219" fill="#4bdbca" font-size="19">Access + operations</text>
<path d="M60 296H900" stroke="url(#accent)" stroke-opacity=".4"/>
<text x="34" y="338" fill="#b5c4dd" font-size="22">Separate bot process · Server-side permissions · Shared role map</text>
