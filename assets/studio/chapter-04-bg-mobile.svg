<svg xmlns="http://www.w3.org/2000/svg" width="520" height="130" viewBox="0 0 520 130" role="img" aria-labelledby="title desc"><title id="title">ТЕХНОЛОГИИ</title><desc id="desc">ТЕХНОЛОГИИ. Decorative motion stops with reduced-motion preferences.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#090c19"/><stop offset=".6" stop-color="#15132e"/><stop offset="1" stop-color="#062b32"/></linearGradient><linearGradient id="ink"><stop stop-color="#b09bff"/><stop offset=".5" stop-color="#70baff"/><stop offset="1" stop-color="#5ff4d1"/></linearGradient><radialGradient id="a"><stop stop-color="#7157ed" stop-opacity=".28"/><stop offset="1" stop-color="#7157ed" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#95a9e0" stroke-opacity=".05" fill="none"/></pattern></defs><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:monospace}.rot{transform-origin:760px 240px;animation:rot 42s linear infinite}.rev{transform-origin:760px 240px;animation:rot 58s linear infinite reverse}.beam{stroke-dasharray:16 280;animation:beam 14s linear infinite}.float{animation:float 9s ease-in-out infinite}.pulse{animation:pulse 7s ease-in-out infinite}@keyframes rot{to{transform:rotate(360deg)}}@keyframes beam{to{stroke-dashoffset:-1184}}@keyframes float{50%{transform:translateY(-9px)}}@keyframes pulse{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="520" height="130" rx="18" fill="url(#bg)"/><rect width="520" height="130" rx="18" fill="url(#grid)"/><rect x=".5" y=".5" width="519" height="129" rx="18" fill="none" stroke="#414260"/><text x="20" y="92" fill="#393954" font-size="88" font-weight="700" >04</text><text x="145" y="73" fill="#f4f5ff" font-size="27" font-weight="700" >ТЕХНОЛОГИИ</text><path d="M145 97H490" stroke="#384666"/><path class="beam" d="M145 97H490" stroke="url(#ink)" stroke-width="2"/></svg>