<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="242" viewBox="0 0 1000 242" role="img" aria-labelledby="title desc"><title id="title">Процес на разработка</title><desc id="desc">Процес на разработка. Decorative motion stops with reduced-motion preferences.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#090c19"/><stop offset=".6" stop-color="#15132e"/><stop offset="1" stop-color="#062b32"/></linearGradient><linearGradient id="ink"><stop stop-color="#b09bff"/><stop offset=".5" stop-color="#70baff"/><stop offset="1" stop-color="#5ff4d1"/></linearGradient><radialGradient id="a"><stop stop-color="#7157ed" stop-opacity=".28"/><stop offset="1" stop-color="#7157ed" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#95a9e0" stroke-opacity=".05" fill="none"/></pattern></defs><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:monospace}.rot{transform-origin:760px 240px;animation:rot 42s linear infinite}.rev{transform-origin:760px 240px;animation:rot 58s linear infinite reverse}.beam{stroke-dasharray:16 280;animation:beam 14s linear infinite}.float{animation:float 9s ease-in-out infinite}.pulse{animation:pulse 7s ease-in-out infinite}@keyframes rot{to{transform:rotate(360deg)}}@keyframes beam{to{stroke-dashoffset:-1184}}@keyframes float{50%{transform:translateY(-9px)}}@keyframes pulse{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1000" height="242" rx="18" fill="url(#bg)"/><rect width="1000" height="242" rx="18" fill="url(#grid)"/><rect x=".5" y=".5" width="999" height="241" rx="18" fill="none" stroke="#414260"/><text x="36" y="47" fill="#94a5c8" font-size="16" font-weight="700" letter-spacing="2">ОТ ЗАДАЧАТА ДО ПРОДУКТА</text><path d="M90 135H910" stroke="#34445f" stroke-width="2"/><path d="M90 135H910" class="beam" stroke="url(#ink)" stroke-width="3"/><circle cx="90" cy="135" r="30" fill="#101b30" stroke="url(#ink)"/><text x="90" y="144" fill="#d4d9ff" font-size="22" font-weight="700" text-anchor="middle">01</text><text x="90" y="197" fill="#a6bcd6" font-size="15" font-weight="700" text-anchor="middle">ОБХВАТ</text><circle cx="295" cy="135" r="30" fill="#101b30" stroke="url(#ink)"/><text x="295" y="144" fill="#d4d9ff" font-size="22" font-weight="700" text-anchor="middle">02</text><text x="295" y="197" fill="#a6bcd6" font-size="15" font-weight="700" text-anchor="middle">ДИЗАЙН</text><circle cx="500" cy="135" r="30" fill="#101b30" stroke="url(#ink)"/><text x="500" y="144" fill="#d4d9ff" font-size="22" font-weight="700" text-anchor="middle">03</text><text x="500" y="197" fill="#a6bcd6" font-size="15" font-weight="700" text-anchor="middle">ЛОГИКА</text><circle cx="705" cy="135" r="30" fill="#101b30" stroke="url(#ink)"/><text x="705" y="144" fill="#d4d9ff" font-size="22" font-weight="700" text-anchor="middle">04</text><text x="705" y="197" fill="#a6bcd6" font-size="15" font-weight="700" text-anchor="middle">ПРОВЕРКА</text><circle cx="910" cy="135" r="30" fill="#101b30" stroke="url(#ink)"/><text x="910" y="144" fill="#d4d9ff" font-size="22" font-weight="700" text-anchor="middle">05</text><text x="910" y="197" fill="#a6bcd6" font-size="15" font-weight="700" text-anchor="middle">ПУСКАНЕ</text></svg>