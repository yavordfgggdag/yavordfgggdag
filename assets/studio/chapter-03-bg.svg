<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="144" viewBox="0 0 1000 144" role="img" aria-labelledby="title desc"><title id="title">УСЛУГИ</title><desc id="desc">УСЛУГИ. Decorative motion stops with reduced-motion preferences.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#090c19"/><stop offset=".6" stop-color="#15132e"/><stop offset="1" stop-color="#062b32"/></linearGradient><linearGradient id="ink"><stop stop-color="#b09bff"/><stop offset=".5" stop-color="#70baff"/><stop offset="1" stop-color="#5ff4d1"/></linearGradient><radialGradient id="a"><stop stop-color="#7157ed" stop-opacity=".28"/><stop offset="1" stop-color="#7157ed" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#95a9e0" stroke-opacity=".05" fill="none"/></pattern></defs><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:monospace}.rot{transform-origin:760px 240px;animation:rot 42s linear infinite}.rev{transform-origin:760px 240px;animation:rot 58s linear infinite reverse}.beam{stroke-dasharray:16 280;animation:beam 14s linear infinite}.float{animation:float 9s ease-in-out infinite}.pulse{animation:pulse 7s ease-in-out infinite}@keyframes rot{to{transform:rotate(360deg)}}@keyframes beam{to{stroke-dashoffset:-1184}}@keyframes float{50%{transform:translateY(-9px)}}@keyframes pulse{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1000" height="144" rx="18" fill="url(#bg)"/><rect width="1000" height="144" rx="18" fill="url(#grid)"/><rect x=".5" y=".5" width="999" height="143" rx="18" fill="none" stroke="#414260"/><text x="28" y="93" fill="#33344f" font-size="92" font-weight="700" >01</text><text x="170" y="57" fill="#f2f4ff" font-size="30" font-weight="700" >УСЛУГИ</text><text x="172" y="93" fill="#a8b9d5" font-size="17" font-weight="400" >От първата идея до следващата версия.</text><path d="M170 121H950" stroke="#36425a"/><path d="M170 121H950" class="beam" stroke="url(#ink)" stroke-width="2"/></svg>