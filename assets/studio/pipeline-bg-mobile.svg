<svg xmlns="http://www.w3.org/2000/svg" width="520" height="540" viewBox="0 0 520 540" role="img" aria-labelledby="title desc"><title id="title">Процес</title><desc id="desc">Процес. Decorative motion stops with reduced-motion preferences.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#090c19"/><stop offset=".6" stop-color="#15132e"/><stop offset="1" stop-color="#062b32"/></linearGradient><linearGradient id="ink"><stop stop-color="#b09bff"/><stop offset=".5" stop-color="#70baff"/><stop offset="1" stop-color="#5ff4d1"/></linearGradient><radialGradient id="a"><stop stop-color="#7157ed" stop-opacity=".28"/><stop offset="1" stop-color="#7157ed" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#95a9e0" stroke-opacity=".05" fill="none"/></pattern></defs><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:monospace}.rot{transform-origin:760px 240px;animation:rot 42s linear infinite}.rev{transform-origin:760px 240px;animation:rot 58s linear infinite reverse}.beam{stroke-dasharray:16 280;animation:beam 14s linear infinite}.float{animation:float 9s ease-in-out infinite}.pulse{animation:pulse 7s ease-in-out infinite}@keyframes rot{to{transform:rotate(360deg)}}@keyframes beam{to{stroke-dashoffset:-1184}}@keyframes float{50%{transform:translateY(-9px)}}@keyframes pulse{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="520" height="540" rx="18" fill="url(#bg)"/><rect width="520" height="540" rx="18" fill="url(#grid)"/><rect x=".5" y=".5" width="519" height="539" rx="18" fill="none" stroke="#414260"/><path d="M75 70V470" stroke="#364660" stroke-width="2"/><path class="beam" d="M75 70V470" stroke="url(#ink)" stroke-width="3"/><circle cx="75" cy="70" r="29" fill="#101b30" stroke="url(#ink)"/><text x="75" y="78" fill="#d3d9ff" font-size="22" font-weight="700" text-anchor="middle">01</text><text x="140" y="79" fill="#e9efff" font-size="26" font-weight="700" >ОБХВАТ</text><circle cx="75" cy="170" r="29" fill="#101b30" stroke="url(#ink)"/><text x="75" y="178" fill="#d3d9ff" font-size="22" font-weight="700" text-anchor="middle">02</text><text x="140" y="179" fill="#e9efff" font-size="26" font-weight="700" >ДИЗАЙН</text><circle cx="75" cy="270" r="29" fill="#101b30" stroke="url(#ink)"/><text x="75" y="278" fill="#d3d9ff" font-size="22" font-weight="700" text-anchor="middle">03</text><text x="140" y="279" fill="#e9efff" font-size="26" font-weight="700" >ЛОГИКА</text><circle cx="75" cy="370" r="29" fill="#101b30" stroke="url(#ink)"/><text x="75" y="378" fill="#d3d9ff" font-size="22" font-weight="700" text-anchor="middle">04</text><text x="140" y="379" fill="#e9efff" font-size="26" font-weight="700" >ПРОВЕРКА</text><circle cx="75" cy="470" r="29" fill="#101b30" stroke="url(#ink)"/><text x="75" y="478" fill="#d3d9ff" font-size="22" font-weight="700" text-anchor="middle">05</text><text x="140" y="479" fill="#e9efff" font-size="26" font-weight="700" >ПУСКАНЕ</text></svg>