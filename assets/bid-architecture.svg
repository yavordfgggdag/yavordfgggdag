<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc"><title id="title">Before I Deploy architecture</title><desc id="desc">SwiftUI sends commands to a Node.js engine through NDJSON. The engine checks local projects and connects to hosting and optional cloud services. This is an architecture diagram, not a product screenshot.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#12152f"/><stop offset="1" stop-color="#081c29"/></linearGradient><linearGradient id="accent"><stop stop-color="#ae8fff"/><stop offset=".52" stop-color="#57b6ff"/><stop offset="1" stop-color="#46dccc"/></linearGradient><radialGradient id="glow"><stop stop-color="#8171e0" stop-opacity=".2"/><stop offset="1" stop-color="#8171e0" stop-opacity="0"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#7d9dd2" stroke-opacity=".06"/></pattern></defs><style>text{font-family:Arial,Helvetica,sans-serif}.flow{stroke-dasharray:5 12;animation:flow 8s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}.orbit{transform-origin:830px 84px;animation:orbit 28s linear infinite}@keyframes flow{to{stroke-dashoffset:-170}}@keyframes pulse{50%{opacity:.35}}@keyframes orbit{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="960" height="430" rx="24" fill="url(#bg)"/><rect width="960" height="430" rx="24" fill="url(#grid)"/><rect x="1" y="1" width="958" height="428" rx="23" fill="none" stroke="#34405e"/>
<text x="34" y="45" fill="#af96ff" font-size="17" letter-spacing="3">BEFORE I DEPLOY / UNDER THE INTERFACE</text>
<text x="34" y="91" fill="#f4f6ff" font-size="34" font-weight="700">A native app. A reusable engine.</text>
<path d="M294 181H344M626 181H674M485 236V292" stroke="#345773" stroke-width="3" fill="none"/>
<path d="M294 181H344M626 181H674M485 236V292" stroke="url(#accent)" stroke-width="3" fill="none" class="flow"/>
<rect x="34" y="127" width="260" height="110" rx="15" fill="#101c30" stroke="#b398ff" stroke-opacity=".55"/><rect x="52" y="149" width="5" height="66" rx="2" fill="#b398ff"/><text x="74" y="174" fill="#eef4ff" font-size="27" font-weight="700">SwiftUI</text><text x="74" y="209" fill="#b398ff" font-size="19">macOS interface</text><rect x="344" y="127" width="282" height="110" rx="15" fill="#101c30" stroke="#64bbff" stroke-opacity=".55"/><rect x="362" y="149" width="5" height="66" rx="2" fill="#64bbff"/><text x="384" y="174" fill="#eef4ff" font-size="27" font-weight="700">Node.js engine</text><text x="384" y="209" fill="#64bbff" font-size="19">Commands + NDJSON</text><rect x="674" y="127" width="252" height="110" rx="15" fill="#101c30" stroke="#4bdbca" stroke-opacity=".55"/><rect x="692" y="149" width="5" height="66" rx="2" fill="#4bdbca"/><text x="714" y="174" fill="#eef4ff" font-size="27" font-weight="700">Hosting</text><text x="714" y="209" fill="#4bdbca" font-size="19">Preview + release</text>
