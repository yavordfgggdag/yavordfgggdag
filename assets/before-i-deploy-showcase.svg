<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="650" viewBox="0 0 1440 650" role="img" aria-label="Before I Deploy: product architecture and release workflow illustration"><defs><linearGradient id="bg" x2="100%" y2="100%"><stop stop-color="#11112c"/><stop offset="1" stop-color="#071a25"/></linearGradient><linearGradient id="accent"><stop stop-color="#a78bfa"/><stop offset=".5" stop-color="#38bdf8"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#a5b4fc" stroke-opacity=".045"/></pattern></defs><style>text{font-family:Inter,Arial,sans-serif}.small{font-family:monospace;letter-spacing:2px}.wire{stroke-dasharray:8 12;animation:flow 3s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}.scan{animation:scan 5s ease-in-out infinite}.cursor{animation:blink 1.2s steps(2,end) infinite}@keyframes flow{to{stroke-dashoffset:-100}}@keyframes pulse{50%{opacity:.35}}@keyframes scan{0%,100%{transform:translateY(0);opacity:.25}50%{transform:translateY(125px);opacity:.85}}@keyframes blink{50%{opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1440" height="650" rx="28" fill="url(#bg)"/><rect width="1440" height="650" rx="28" fill="url(#grid)"/><rect x="1" y="1" width="1438" height="648" rx="27" fill="none" stroke="#334155"/><rect x="44" y="42" width="6" height="57" rx="3" fill="url(#accent)"/><text x="68" y="60" fill="#a78bfa" font-size="15" class="small">01 / PRODUCT ENGINEERING</text><text x="68" y="103" fill="#f8fafc" font-size="38" font-weight="700">Before I Deploy</text><text x="68" y="141" fill="#a6b5cb" font-size="20">From a local project to a more confident release.</text><rect x="1092" y="45" width="300" height="36" rx="18" fill="#182338" stroke="#34445d"/><circle cx="1115" cy="63" r="5" fill="#2dd4bf" class="pulse"/><text x="1131" y="69" fill="#cbd5e1" font-size="13" class="small">ARCHITECTURE STUDY</text><path d="M426 337H507M933 337H1014" stroke="url(#accent)" stroke-width="3" fill="none" class="wire"/><g><rect x="48" y="198" width="378" height="280" rx="18" fill="#14162b" stroke="#4c3d73"/><rect x="48" y="198" width="378" height="43" rx="18" fill="#22213d"/><circle cx="69" cy="220" r="4" fill="#fb7185"/><circle cx="85" cy="220" r="4" fill="#fbbf24"/><circle cx="101" cy="220" r="4" fill="#34d399"/><text x="123" y="225" fill="#b9a5f7" font-size="13" class="small">NATIVE APP</text><text x="74" y="283" fill="#fff" font-size="27" font-weight="700">A clear control room.</text><text x="74" y="317" fill="#b5bfd1" font-size="18">SwiftUI / macOS</text><rect x="74" y="344" width="326" height="99" rx="10" fill="#0b1020"/><text x="94" y="370" fill="#a78bfa" font-size="15">Project overview</text><path d="M94 389H300M94 405H358M94 421H253" stroke="#38415e" stroke-width="5" stroke-linecap="round"/><rect x="74" y="306" width="326" height="2" fill="#a78bfa" opacity=".4" class="scan"/></g><g><rect x="507" y="198" width="426" height="280" rx="18" fill="#0e1c2d" stroke="#275c77"/><text x="535" y="237" fill="#38bdf8" font-size="14" class="small">DETERMINISTIC ENGINE</text><text x="535" y="283" fill="#fff" font-size="27" font-weight="700">Inspect. Explain. Improve.</text><text x="535" y="317" fill="#b5bfd1" font-size="18">Node.js / CLI / NDJSON</text><rect x="535" y="344" width="370" height="99" rx="10" fill="#081321"/><text x="555" y="372" fill="#7dd3fc" font-size="16" font-family="monospace">$ bid</text><text x="555" y="400" fill="#b5bfd1" font-size="15" font-family="monospace">project → checks → clear next steps</text><text x="555" y="426" fill="#2dd4bf" font-size="15" font-family="monospace">review before release</text><rect x="752" y="414" width="8" height="15" fill="#2dd4bf" class="cursor"/></g><g><rect x="1014" y="198" width="378" height="280" rx="18" fill="#0e222b" stroke="#25615e"/><text x="1042" y="237" fill="#2dd4bf" font-size="14" class="small">CONNECTED SERVICES</text><text x="1042" y="283" fill="#fff" font-size="27" font-weight="700">Beyond the interface.</text><text x="1042" y="317" fill="#b5bfd1" font-size="18">Supabase / Postgres / APIs</text><g fill="#142f36" stroke="#285257"><rect x="1042" y="346" width="150" height="40" rx="9"/><rect x="1205" y="346" width="159" height="40" rx="9"/><rect x="1042" y="401" width="322" height="40" rx="9"/></g><text x="1061" y="372" fill="#b1e8df" font-size="16">Accounts</text><text x="1224" y="372" fill="#b1e8df" font-size="16">Integrations</text><text x="1061" y="427" fill="#b1e8df" font-size="16">Data • access rules • cloud functions</text></g><path d="M84 545H1356" stroke="#263751" stroke-width="2"/><path d="M84 545H1356" stroke="url(#accent)" stroke-width="2" class="wire"/><g fill="#0f172a" stroke="#6573a4" stroke-width="2"><circle cx="84" cy="545" r="8"/><circle cx="402" cy="545" r="8"/><circle cx="720" cy="545" r="8"/><circle cx="1038" cy="545" r="8"/><circle cx="1356" cy="545" r="8"/></g><g fill="#d3dbee" font-size="17" text-anchor="middle"><text x="84" y="580">Inspect</text><text x="402" y="580">Explain</text><text x="720" y="580">Review fixes</text><text x="1038" y="580">Validate</text><text x="1356" y="580">Release</text></g><text x="720" y="622" text-anchor="middle" fill="#73849d" font-size="13">Illustrated product architecture • not a live dashboard or release-status report</text></svg>
