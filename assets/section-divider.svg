<svg xmlns="http://www.w3.org/2000/svg" width="960" height="36" viewBox="0 0 960 36" role="img" aria-labelledby="title desc"><title id="title">Section transition</title><desc id="desc">Decorative purple, blue and turquoise line.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#12152f"/><stop offset="1" stop-color="#081c29"/></linearGradient><linearGradient id="accent"><stop stop-color="#ae8fff"/><stop offset=".52" stop-color="#57b6ff"/><stop offset="1" stop-color="#46dccc"/></linearGradient><radialGradient id="glow"><stop stop-color="#8171e0" stop-opacity=".2"/><stop offset="1" stop-color="#8171e0" stop-opacity="0"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#7d9dd2" stroke-opacity=".06"/></pattern></defs><style>text{font-family:Arial,Helvetica,sans-serif}.flow{stroke-dasharray:5 12;animation:flow 8s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}.orbit{transform-origin:830px 84px;animation:orbit 28s linear infinite}@keyframes flow{to{stroke-dashoffset:-170}}@keyframes pulse{50%{opacity:.35}}@keyframes orbit{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="960" height="36" rx="24" fill="url(#bg)"/><rect width="960" height="36" rx="24" fill="url(#grid)"/><rect x="1" y="1" width="958" height="34" rx="23" fill="none" stroke="#34405e"/><path d="M20 18H940" stroke="url(#accent)" stroke-opacity=".2"/><path d="M20 18H940" stroke="url(#accent)" stroke-width="2" class="flow"/><circle cx="480" cy="18" r="4" fill="#65c3f2" class="pulse"/></svg>