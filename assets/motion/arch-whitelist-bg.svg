<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Път на кандидатурата в The Last Republic</title><desc id="desc">Илюстрация на реализирания поток: кандидатът влиза с Discord и решава двучасов изпит с три опита на акаунт; кандидатурата се записва в Postgres; постоянно свързан Discord бот я публикува с бутони за приемане и отказ; екипът решава със задължителна причина; ботът препраща решението към сайта с HMAC-SHA256 подпис и час; сайтът го прилага, а кандидатът получава публикация и лично съобщение. Полицейският портал проверява ID на ролите в Discord на сървъра при всяка заявка и отказва при грешка.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D0A26"/><stop offset="0.6" stop-color="#151040"/><stop offset="1" stop-color="#071B2B"/></linearGradient><radialGradient id="ga"><stop offset="0" stop-color="#8B5CF6" stop-opacity="0.35"/><stop offset=".55" stop-color="#8B5CF6" stop-opacity="0.122"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient><radialGradient id="gb"><stop offset="0" stop-color="#22D3EE" stop-opacity="0.28"/><stop offset=".55" stop-color="#22D3EE" stop-opacity="0.098"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8C85D9" stroke-opacity=".07"/></pattern><linearGradient id="chain" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A78BFA"/><stop offset="0.5" stop-color="#F472B6"/><stop offset="1" stop-color="#34D399"/></linearGradient></defs><style>text{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace}.live{display:none}@media (prefers-reduced-motion:no-preference){.live{display:inline}.still{display:none}}</style><clipPath id="frame"><rect width="1200" height="520" rx="24"/></clipPath><rect width="1200" height="520" rx="24" fill="url(#bg)"/><rect width="1200" height="520" rx="24" fill="url(#grid)"/><g clip-path="url(#frame)"><circle cx="1020" cy="52" r="420" fill="url(#ga)"/><circle cx="120" cy="494" r="360" fill="url(#gb)"/></g><rect x="40" y="38" width="28" height="4" rx="2" fill="#F472B6"/><text x="80" y="46" font-size="14" fill="#C4B5FD" font-weight="700" letter-spacing="3">ПЪТ НА КАНДИДАТУРАТА · АРХИТЕКТУРА</text><path d="M145 136H1065V306H145" fill="none" stroke="url(#chain)" stroke-width="2.4" opacity=".5"/><g class="live"><g><circle r="18" fill="#F472B6" opacity=".3"/><circle r="7" fill="#FFF0F7"/><animateMotion dur="14.0s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.85;1" calcMode="linear" path="M145 136H1065V306H145"/></g></g><rect x="40" y="92" width="210" height="88" rx="18" fill="#1A1548" fill-opacity=".92" stroke="#A78BFA" stroke-opacity=".75" stroke-width="1.6"/><rect x="56" y="110" width="4" height="52" rx="2" fill="#A78BFA"/><text x="76" y="132" font-size="18" fill="#F7F5FF" font-weight="700">Кандидат</text><text x="76" y="159" font-size="13" fill="#ADA6DA">вход с Discord</text><rect x="270" y="92" width="210" height="88" rx="18" fill="#1A1548" fill-opacity=".92" stroke="#F472B6" stroke-opacity=".75" stroke-width="1.6"/><rect x="286" y="110" width="4" height="52" rx="2" fill="#F472B6"/><text x="306" y="132" font-size="18" fill="#F7F5FF" font-weight="700">Whitelist изпит</text><text x="306" y="159" font-size="13" fill="#ADA6DA">2 часа · 3 опита</text><rect x="500" y="92" width="210" height="88" rx="18" fill="#1A1548" fill-opacity=".92" stroke="#4F7BFF" stroke-opacity=".75" stroke-width="1.6"/><rect x="516" y="110" width="4" height="52" rx="2" fill="#4F7BFF"/><text x="536" y="132" font-size="18" fill="#F7F5FF" font-weight="700">Postgres</text><text x="536" y="159" font-size="13" fill="#ADA6DA">записана кандидатура</text><rect x="730" y="92" width="210" height="88" rx="18" fill="#1A1548" fill-opacity=".92" stroke="#7C8BFF" stroke-opacity=".75" stroke-width="1.6"/><rect x="746" y="110" width="4" height="52" rx="2" fill="#7C8BFF"/><text x="766" y="132" font-size="18" fill="#F7F5FF" font-weight="700">Discord бот</text><text x="766" y="159" font-size="13" fill="#ADA6DA">постоянен Gateway</text><rect x="960" y="92" width="210" height="88" rx="18" fill="#1A1548" fill-opacity=".92" stroke="#FBBF24" stroke-opacity=".75" stroke-width="1.6"/><rect x="976" y="110" width="4" height="52" rx="2" fill="#FBBF24"/><text x="996" y="132" font-size="18" fill="#F7F5FF" font-weight="700">Екип</text><text x="996" y="159" font-size="13" fill="#ADA6DA">решение + причина</text><rect x="960" y="262" width="210" height="88" rx="18" fill="#1A1548" fill-opacity=".92" stroke="#34D399" stroke-opacity=".75" stroke-width="1.6"/><rect x="976" y="280" width="4" height="52" rx="2" fill="#34D399"/><text x="996" y="302" font-size="18" fill="#F7F5FF" font-weight="700">Подписан relay</text><text x="996" y="329" font-size="13" fill="#ADA6DA">HMAC-SHA256 + час</text><rect x="500" y="262" width="210" height="88" rx="18" fill="#1A1548" fill-opacity=".92" stroke="#22D3EE" stroke-opacity=".75" stroke-width="1.6"/><rect x="516" y="280" width="4" height="52" rx="2" fill="#22D3EE"/><text x="536" y="302" font-size="18" fill="#F7F5FF" font-weight="700">Next.js сайт</text><text x="536" y="329" font-size="13" fill="#ADA6DA">прилага решението</text><rect x="40" y="262" width="210" height="88" rx="18" fill="#1A1548" fill-opacity=".92" stroke="#C4B5FD" stroke-opacity=".75" stroke-width="1.6"/><rect x="56" y="280" width="4" height="52" rx="2" fill="#C4B5FD"/><text x="76" y="302" font-size="18" fill="#F7F5FF" font-weight="700">Кандидат</text><text x="76" y="329" font-size="13" fill="#ADA6DA">канал + лично съобщение</text><rect x="40" y="392" width="1120" height="76" rx="18" fill="none" stroke="#FBBF24" stroke-opacity=".6" stroke-dasharray="6 6"/><g transform="translate(67 415)"><path class="" d="M13 0l13 5v9c0 8-6 14-13 16C6 28 0 22 0 14V5z" fill="#0D0A26" stroke="#FBBF24" stroke-width="2"/><path d="M8 15l4 4 7-8" fill="none" stroke="#FBBF24" stroke-width="2.4" stroke-linecap="round"/></g><text x="112" y="424" font-size="16" fill="#FBBF24" font-weight="600">Полицейски портал: нова проверка в Discord при всяка заявка,</text><text x="112" y="448" font-size="16" fill="#FDE68A">само по ID на ролята, никога по име. Всяка грешка отказва достъпа.</text><text x="1160" y="506" font-size="13" fill="#ADA6DA" text-anchor="end">Илюстрация на архитектурата · не е табло на живо</text></svg>
