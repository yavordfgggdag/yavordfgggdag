<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc"><title id="title">Архитектура на TLR Police Portal</title><desc id="desc">Илюстрация. Събитията за членство в Discord изискват постоянна връзка, затова отделен Node.js бот поддържа Gateway връзката и синхронизира данните за състава в Postgres (Neon, Drizzle ORM). Next.js порталът чете състава и изпълнява разрешени действия след проверка на правата на сървъра, като записва журнал. Ботът и порталът използват обща карта на ролите. Служителите влизат с Discord.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D0A26"/><stop offset="0.6" stop-color="#151040"/><stop offset="1" stop-color="#071B2B"/></linearGradient><radialGradient id="ga"><stop offset="0" stop-color="#8B5CF6" stop-opacity="0.35"/><stop offset=".55" stop-color="#8B5CF6" stop-opacity="0.122"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient><radialGradient id="gb"><stop offset="0" stop-color="#22D3EE" stop-opacity="0.28"/><stop offset=".55" stop-color="#22D3EE" stop-opacity="0.098"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8C85D9" stroke-opacity=".07"/></pattern></defs><style>text{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace}.live{display:none}@media (prefers-reduced-motion:no-preference){.live{display:inline}.still{display:none}@keyframes flow{to{stroke-dashoffset:-36}}.sh{animation:sh 6s ease-out infinite;animation-delay:3.4s}@keyframes sh{0%{stroke-width:5}30%,100%{stroke-width:2}}.pk1{animation:pk1 5s cubic-bezier(.5,0,.5,1) infinite;animation-delay:0s}@keyframes pk1{0%{transform:translate(0,0);opacity:0}5%{opacity:1}35%{transform:translate(40px,0px);opacity:1}42%