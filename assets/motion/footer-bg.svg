t="42" rx="8"/></clipPath><rect x="382" y="26" width="128" height="42" rx="8" fill="#7C3AED"/><g clip-path="url(#c1)" class="live"><rect class="shn" style="--d:208px;animation-delay:1.4s" x="382" y="26" width="60" height="42" fill="url(#sh)" transform="skewX(-18)"/></g><text x="446" y="54" font-size="17" fill="#fff" font-weight="800" text-anchor="middle" letter-spacing="2">СОФТУЕР</text><clipPath id="c2"><rect x="524" y="26" width="115" height="42" rx="8"/></clipPath><rect x="524" y="26" width="115" height="42" rx="8" fill="#5865F2"/><g clip-path="url(#c2)" class="live"><rect class="shn" style="--d:195px;animation-delay:2.8s" x="524" y="26" width="60" height="42" fill="url(#sh)" transform="skewX(-18)"/></g><text x="581.25" y="54" font-size="17" fill="#fff" font-weight="800" text-anchor="middle" letter-spacing="2">БОТОВЕ</text><clipPath id="c3"><rect x="653" y="26" width="90" height="42" rx="8"/></clipPath><rect x="653" y="26" width="90" height="42" rx="8" fill="#E11D48"/><g clip-path="url(#c3)" class="live"><rect class="shn" style="--d:170px;animation-delay:4.2s" x="653" y="26" width="60" height="42" fill="url(#sh)" transform="skewX(-18)"/></g><text x="697.75" y="54" font-size="17" fill="#fff" font-weight="800" text-anchor="middle" letter-spacing="2">ИГРИ</text><clipPath id="c4"><rect x="757" y="26" width="202" height="42" rx="8"/></clipPath><rect x="757" y="26" width="202" height="42" rx="8" fill="#059669"/><g clip-path="url(#c4)" class="live"><rect class="shn" style="--d:282px;animation-delay:5.6s" x="757" y="26" width="60" height="42" fill="url(#sh)" transform="skewX(-18)"/></g><text x="858" y="54" font-size="17" fill="#fff" font-weight="800" text-anchor="middle" letter-spacing="2">АВТОМАТИЗАЦИИ</text><text x="600" y="112" font-size="32" fill="url(#hg)" font-weight="800" text-anchor="middle">Вашата идея. Ясен план. Работещ софтуер.</text><text x="600" y="148" font-size="15" fill="#ADA6DA" font-weight="700" text-anchor="middle" letter-spacing="1" class="mono">СЪЗД