<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1220" viewBox="0 0 600 1220" role="img" aria-labelledby="title desc"><title id="title">The Last Republic whitelist flow</title><desc id="desc">Illustration of the implemented flow: the applicant signs in with Discord and takes a two-hour exam with three attempts per account; the application is saved in Postgres; an always-on Discord bot posts it with accept and reject buttons; staff decide with a mandatory reason; the bot relays the decision to the site with an HMAC-SHA256 signature and timestamp; the site applies it and the applicant gets a channel post and a direct message. The Police Portal checks Discord role IDs server-side on every request and fails closed.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D0A26"/><stop offset="0.6" stop-color="#151040"/><stop offset="1" stop-color="#071B2B"/></linearGradient><radialGradient id="ga"><stop offset="0" stop-color="#8B5CF6" stop-opacity="0.35"/><stop offset=".55" stop-color="#8B5CF6" stop-opacity="0.122"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient><radialGradient id="gb"><stop offset="0" stop-color="#22D3EE" stop-opacity="0.28"/><stop offset=".55" stop-color="#22D3EE" stop-opacity="0.098"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8C85D9" stroke-opacity=".07"/></pattern><linearGradient id="chain" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A78BFA"/><stop offset="0.5" stop-color="#F472B6"/><stop offset="1" stop-color="#34D399"/></linearGradient></defs><style>text{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace}.live{display:none}@media (prefers-reduced-motion:no-preference){.live{display:inline}.still{display:none}}</style><clipPath id="frame"><rect width="600" height="1220" rx="24"/></clipPath><rect width="600" height="1220" rx="24" fill="url(#bg)"/><rect width="600" height="1220" rx="24" fill="url(#grid)"/><g clip-path="url(#frame)"><circle cx="510" cy="122" r="210" fill="url(#ga)"/><circle cx="60" cy="1159" r="180" fill="url(#gb)"/></g><rect x="40" y="38" width="28" height="4" rx="2" fill="#F472B6"/><text x="80" y="46" font-size="14" fill="#C4B5FD" font-weight="700" letter-spacing="3">WHITELIST FLOW · ARCHITECTURE</text><rect x="40" y="86" width="520" height="80" rx="18" fill="#1A1548" fill-opacity=".92" stroke="#A78BFA" stroke-opacity=".75" stroke-width="1.6"/><rect x="56" y="104" width="4" height="44" rx="2" fill="#A78BFA"/><text x="76" y="122" font-size="22" fill="#F7F5FF" font-weight="700">Applicant</text><text x="76" y="149" font-size="17" fill="#ADA6DA">Discord sign-in</text><rect x="40" y="190" width="520" height="80" rx="18" fill="#1A1548" fill-opacity=".92" stroke="#F472B6" stroke-opacity=".75" stroke-width="1.6"/><rect x="56" y="208" width="4" height="44" rx="2" fill="#F472B6"/><text x="76" y="226" font-size="22" fill="#F7F5FF" font-weight="700">Whitelist exam</text><text x="76" y="253" font-size="17" fill="#ADA6DA">2 h · 3 attempts</text><rect x="40" y="294" width="520" height="80" rx="18" fill="#1A1548" fill-opacity=".92" stroke="#4F7BFF" stroke-opacity=".75" stroke-width="1.6"/><rect x="56" y="312" width="4" height="44" rx="2" fill="#4F7BFF"/><text x="76" y="330" font-size="22" fill="#F7F5FF" font-weight="700">Postgres</text><text x="76" y="357" font-size="17" fill="#ADA6DA">application saved</text><rect x="40" y="398" width="520" height="80" rx="18" fill="#1A1548" fill-opacity=".92" stroke="#7C8BFF" stroke-opacity=".75" stroke-width="1.6"/><rect x="56" y="416" width="4" height="44" rx="2" fill="#7C8BFF"/><text x="76" y="434" font-size="22" fill="#F7F5FF" font-weight="700">Discord bot</text><text x="76" y="461" font-size="17" fill="#ADA6DA">always-on Gateway</text><rect x="40" y="502" width="520" height="80" rx="18" fill="#1A1548" fill-opacity=".92" stroke="#FBBF24" stroke-opacity=".75" stroke-width="1.6"/><rect x="56" y="520" width="4" height="44" rx="2" fill="#FBBF24"/><text x="76" y="538" font-size="22" fill="#F7F5FF" font-weight="700">Staff</text><text x="76" y="565" font-size="17" fill="#ADA6DA">accept / reject + reason</text><rect x="40" y="606" width="520" height="80" rx="18" fill="#1A1548" fill-opacity=".92" stroke="#34D399" stroke-opacity=".75" stroke-width="1.6"/><rect x="56" y="624" width="4" height="44" rx="2" fill="#34D399"/><text x="76" y="642" font-size="22" fill="#F7F5FF" font-weight="700">Signed relay</text><text x="76" y="669" font-size="17" fill="#ADA6DA">HMAC-SHA256 + time</text><rect x="40" y="710" width="520" height="80" rx="18" fill="#1A1548" fill-opacity=".92" stroke="#22D3EE" stroke-opacity=".75" stroke-width="1.6"/><rect x="56" y="728" width="4" height="44" rx="2" fill="#22D3EE"/><text x="76" y="746" font-size="22" fill="#F7F5FF" font-weight="700">Next.js site</text><text x="76" y="773" font-size="17" fill="#ADA6DA">applies the decision</text><rect x="40" y="814" width="520" height="80" rx="18" fill="#1A1548" fill-opacity=".92" stroke="#C4B5FD" stroke-opacity=".75" stroke-width="1.6"/><rect x="56" y="832" width="4" height="44" rx="2" fill="#C4B5FD"/><text x="76" y="850" font-size="22" fill="#F7F5FF" font-weight="700">Applicant</text><text x="76" y="877" font-size="17" fill="#ADA6DA">channel post + DM</text><g class="live"><g><circle r="18" fill="#F472B6" opacity=".3"/><circle r="7" fill="#FFF0F7"/><animateMotion dur="14.0s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.85;1" calcMode="linear" path="M300 126V854"/></g></g><path d="M300 166V190" stroke="#F472B6" stroke-opacity=".7" stroke-width="2" stroke-dasharray="3 5"/><path d="M300 270V294" stroke="#4F7BFF" stroke-opacity=".7" stroke-width="2" stroke-dasharray="3 5"/><path d="M300 374V398" stroke="#7C8BFF" stroke-opacity=".7" stroke-width="2" stroke-dasharray="3 5"/><path d="M300 478V502" stroke="#FBBF24" stroke-opacity=".7" stroke-width="2" stroke-dasharray="3 5"/><path d="M300 582V606" stroke="#34D399" stroke-opacity=".7" stroke-width="2" stroke-dasharray="3 5"/><path d="M300 686V710" stroke="#22D3EE" stroke-opacity=".7" stroke-width="2" stroke-dasharray="3 5"/><path d="M300 790V814" stroke="#C4B5FD" stroke-opacity=".7" stroke-width="2" stroke-dasharray="3 5"/><rect x="40" y="926" width="520" height="120" rx="18" fill="none" stroke="#FBBF24" stroke-opacity=".6" stroke-dasharray="6 6"/><g transform="translate(63 951)"><path class="" d="M13 0l13 5v9c0 8-6 14-13 16C6 28 0 22 0 14V5z" fill="#0D0A26" stroke="#FBBF24" stroke-width="2"/><path d="M8 15l4 4 7-8" fill="none" stroke="#FBBF24" stroke-width="2.4" stroke-linecap="round"/></g><text x="110" y="960" font-size="16" fill="#FBBF24">Police Portal gate: a fresh Discord</text><text x="110" y="984" font-size="16" fill="#FDE68A">member lookup on every request, matched</text><text x="110" y="1008" font-size="16" fill="#FDE68A">by role ID only, never by name. Any</text><text x="110" y="1032" font-size="16" fill="#FDE68A">error denies access.</text><text x="300" y="1200" font-size="15" fill="#ADA6DA" text-anchor="middle">Architecture illustration · not a live dashboard</text></svg>
