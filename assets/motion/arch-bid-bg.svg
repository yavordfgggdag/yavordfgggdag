<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">Архитектура на Before I Deploy</title><desc id="desc">Илюстрация. SwiftUI приложението изпраща команди към Node.js модул и получава обратно NDJSON събития. Модулът изпълнява една верига от проверки: Git, тайни, зависимости, lint, типове, build и готовност на хостинга. Ако файловете на проекта са променени, продукционното публикуване изисква изрично потвърждение. Файловете и Keychain остават локално; Supabase, Postgres и Deno Edge Functions са облачни услуги по избор.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D0A26"/><stop offset="0.6" stop-color="#151040"/><stop offset="1" stop-color="#071B2B"/></linearGradient><radialGradient id="ga"><stop offset="0" stop-color="#8B5CF6" stop-opacity="0.35"/><stop offset=".55" stop-color="#8B5CF6" stop-opacity="0.122"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient><radialGradient id="gb"><stop offset="0" stop-color="#22D3EE" stop-opacity="0.28"/><stop offset=".55" stop-color="#22D3EE" stop-opacity="0.098"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8C85D9" stroke-opacity=".07"/></pattern><linearGradient id="chain" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8B5CF6"/><stop offset="0.6" stop-color="#22D3EE"/><stop offset="1" stop-color="#FBBF24"/></linearGradient></defs><style>text{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace}.live{display:none}@media (prefers-reduced-motion:no-preference){.live{display:inline}.still{display:none}@keyframes flow{to{stroke-dashoffset:-36}}.ring{opacity:.15;animation:lit 10.0s ease-out infinite}@keyframes lit{0%{opacity:1}30%{opacity:.7}75%,100%{opacity:.15}}.gate{animation:gate 10.0s ease-out infinite}@keyframes gate{0%{stroke-width:5;fill:#3A2A06}25%,100%{stroke-width:2;fill:#0D0A26}}}</style><clipPath id="frame"><rect width="1200" height="500" rx="24"/></clipPath><rect width="1200" height="500" rx="24" fill="url(#bg)"/><rect width="1200" height="500" rx="24" fill="url(#grid)"/><g clip-path="url(#frame)"><circle cx="1020" cy="50" r="420" fill="url(#ga)"/><circle cx="120" cy="475" r="360" fill="url(#gb)"/></g><rect x="40" y="38" width="28" height="4" rx="2" fill="#8B5CF6"/><text x="80" y="46" font-size="14" fill="#C4B5FD" font-weight="700" letter-spacing="3">ПОД ИНТЕРФЕЙСА · АРХИТЕКТУРА</text><rect x="48" y="96" width="270" height="96" rx="18" fill="#1A1548" fill-opacity=".92" stroke="#8B5CF6" stroke-opacity=".75" stroke-width="1.6"/><rect x="64" y="114" width="4" height="60" rx="2" fill="#8B5CF6"/><circle cx="104" cy="144.0" r="22" fill="#8B5CF6" fill-opacity=".18"/><g transform="translate(93.0 133.0) scale(0.9167)"><path d="M7.508 0c-.287 0-.573 0-.86.002-.241.002-.483.003-.724.01-.132.003-.263.009-.395.015A9.154 9.154 0 0 0 4.348.15 5.492 5.492 0 0 0 2.85.645 5.04 5.04 0 0 0 .645 2.848c-.245.48-.4.972-.495 1.5-.093.52-.122 1.05-.136 1.576a35.2 35.2 0 0 0-.012.724C0 6.935 0 7.221 0 7.508v8.984c0 .287 0 .575.002.862.002.24.005.481.012.722.014.526.043 1.057.136 1.576.095.528.25 1.02.495 1.5a5.03 5.03 0 0 0 2.205 2.203c.48.244.97.4 1.498.495.52.093 1.05.124 1.576.138.241.007.483.009.724.01.287.002.573.002.86.002h8.984c.287 0 .573 0 .86-.002.241-.001.483-.003.724-.01a10.523 10.523 0 0 0 1.578-.138 5.322 5.322 0 0 0 1.498-.495 5.035 5.035 0 0 0 2.203-2.203c.245-.48.4-.972.495-1.5.093-.52.124-1.05.138-1.576.007-.241.009-.481.01-.722.002-.287.002-.575.002-.862V7.508c0-.287 0-.573-.002-.86a33.662 33.662 0 0 0-.01-.724 10.5 10.5 0 0 0-.138-1.576 5.328 5.328 0 0 0-.495-1.5A5.039 5.039 0 0 0 21.152.645 5.32 5.32 0 0 0 19.654.15a10.493 10.493 0 0 0-1.578-.138 34.98 34.98 0 0 0-.722-.01C17.067