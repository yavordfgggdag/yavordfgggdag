name: Refresh profile activity
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-metrics
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check metric calculations
        run: python3 scripts/test_metrics.py
      - name: Render public activity and saved language snapshot
        run: python3 scripts/update_metrics.py
      - name: Render journal presentation from the same public data
        run: python3 scripts/render_journal.py --metrics-only
      - name: Save updated visuals
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/metrics assets/journal/metrics data/activity.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh profile activity visuals"
          git push
